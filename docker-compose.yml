version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmasense-db
    environment:
      POSTGRES_DB: pharmasense
      POSTGRES_USER: pharmasense
      POSTGRES_PASSWORD: pharmasense
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasense -d pharmasense"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: pharmasense-adminer
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmasense-app
    environment:
      DATABASE_URL: postgres://pharmasense:pharmasense@postgres:5432/pharmasense?sslmode=disable
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-32-chars
      PORT: "3000"
      NEXT_PORT: "3001"
      ENV: production
      SEED_ON_EMPTY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pharmasense-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - adminer
    restart: unless-stopped

volumes:
  postgres_data:
