version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmasense-db
    environment:
      POSTGRES_DB: pharmasense
      POSTGRES_USER: pharmasense
      POSTGRES_PASSWORD: pharmasense
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasense -d pharmasense"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: pharmasense-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmasense-backend
    environment:
      DATABASE_URL: postgres://pharmasense:pharmasense@postgres:5432/pharmasense?sslmode=disable
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-32-chars
      PORT: "3001"
      ENV: production
      SEED_ON_EMPTY: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: pharmasense-frontend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
